# Unified Capability Catalog — LegacyRetailPortfolio consolidation (Stage 4, planning only)
# Every existing Stage 1 capability (47) gets an explicit disposition. None discarded.
# Evidence tier legend on each entry:
#   verified  = behavior/source-verified in Stage 1-3
#   proposed  = target design decision (this document)
# disposition: migrate_as_is | migrate_unified | migrate_with_context_policy | migrate_api_compat | business_decision_required
# target_module ids are defined in module-ownership-matrix.yaml
version: 1
source_inputs:
  stage1: [analysis-output/orderdesk, analysis-output/customerportal, analysis-output/fulfillmentapi]
  stage2: analysis-output/portfolio
  stage3: evaluation-output
target: Single ASP.NET Core .NET 10 modular monolith (web UI + API compatibility layer)

target_modules_index:
  - MOD-IDENTITY     # auth + account + profile
  - MOD-CUSTOMER     # customer record management (staff + self-service)
  - MOD-CATALOG      # products, categories, availability (read)
  - MOD-QUOTING      # quotes, discounts, approvals, commission (staff)
  - MOD-ORDER        # order capture + lifecycle + cancellation
  - MOD-SHOPPING     # cart, coupons, wishlist (customer)
  - MOD-FULFILLMENT  # allocation, picking, packaging, dispatch
  - MOD-SHIPMENT     # shipments, carrier events, tracking
  - MOD-RETURNS      # return request -> review -> receipt
  - MOD-SUPPORT      # support tickets
  - MOD-SALESOPS     # agent tasks, commission display
  - MOD-REPORTING    # warehouse activity summary
  - MOD-PLATFORM     # cross-cutting: authZ, error handling, API key adapter, DbContext(s)

capabilities:
