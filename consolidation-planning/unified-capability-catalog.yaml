    entities: [Customers]
    workflows: []
    target_web_feature: Staff "Customers" search screen
    target_module: MOD-CUSTOMER
    functional_parity: Same search fields + 200 cap; staff-only authorization.
    evidence: {tier: verified, ref: "analysis-output/orderdesk/capabilities.yaml#OD-CAP-001"}
