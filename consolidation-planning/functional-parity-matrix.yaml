# Functional Parity Matrix — LegacyRetailPortfolio consolidation (planning)
# Exhaustive map: every source capability -> target feature/module + acceptance criteria + tests.
# existing_tests reference the current suites; new_parity_tests are to be written before refactor.
# verification_status: verified (behavior/source-verified upstream) | planned (parity test to add)
# migration_risk: low | medium | high
version: 1
principle: "Parity is demonstrable by test: each capability keeps its verified behavior, proven by an existing or new test."
existing_test_suites:
  - tests/.../OrderDeskWorkflowTests.cs
  - tests/.../OrderDeskRulesTests.cs
  - tests/.../CustomerPortalWorkflowTests.cs
  - tests/.../PortalRulesTests.cs
  - tests/IntegrationTests/FulfillmentWorkflowTests.cs
  - tests/.../FulfillmentRulesTests.cs
  - tests/IntegrationTests/CrossAppWorkflowTests.cs

