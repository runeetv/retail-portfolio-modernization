    infrastructure/cross-cutting rather than business rules. Precision on the GT rule set is not reduced by
    these because the GT rule catalog is explicitly a curated subset; they are reported as over-discovery.

summary:
  gt_rules: 19
  exact: 19
  partial: 0
  incorrect: 0
  unmatched_ground_truth: 0
  behavioral_divergence_rules_correct:
    - RULE-STAFF-CANCEL vs RULE-CUSTOMER-CANCEL (bounded Allocated divergence) correctly reconciled in portfolio RULE-CANCEL
    - mandatory-info duplication correctly identified (DUP-1 family)
    - commission dual-location (SQL authoritative + C# mirror) correctly identified
