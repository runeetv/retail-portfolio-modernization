  - "OD-RULE-002 (quote lines editable only in Draft/PendingApproval)"
  - "OD-RULE-012 (add existing product increments quantity)"
  - "OD-RULE-013 (quote total formula)"
  - "OD-RULE-016 (staff order requires >=1 line + valid agent/customer)"
  - "OD-RULE-017 / CP-RULE-016 (cannot re-cancel a cancelled order)"
  - "OD-RULE-019 (agent task status set)"
  - "OD-RULE-020 (customer contact update requires email + UQ_Customers_Email)"
  - "CP-RULE-002 (locked account cannot sign in)"
  - "CP-RULE-006/007 (cart quantity rules)"
  - "CP-RULE-012 (order total + coupon discount formula)"
  - "CP-RULE-014 (record ownership authorization)"
  - "CP-RULE-018 (one active return per order)"
  - "CP-RULE-020 (no message on closed ticket)"
  - "CP-RULE-023 (CSRF/antiforgery)"
  - "FA-RULE-007 (one pick list per order)"
  - "FA-RULE-008 (picked quantity bounds)"
  - "FA-RULE-011 (unique package code)"
  - "FA-RULE-012/013/014/017 (status roll-forward transitions)"
  - "FA-RULE-015 (shipment transition graph)"
  - "FA-RULE-022 (activity summary order classification)"
  - "FA-RULE-023 (API key)"
