# Capability Matches — Stage 3 evaluation
# Each record maps a ground-truth capability (GT) to the predicted capability(ies).
# classification: exact | partial | incorrect | unmatched_prediction | unmatched_ground_truth | ambiguous
# relation: 1-1 | merge (many predicted -> 1 GT) | split (1 predicted -> many GT)
# scoring unit = one ground-truth capability (counted once).
version: 1
evaluation_unit: ground_truth_capability
ground_truth_file: benchmark/ground-truth/business-capabilities.yaml
primary_prediction_file: analysis-output/portfolio/portfolio-capabilities.yaml
stage1_provenance: true

