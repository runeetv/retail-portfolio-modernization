# ===================== Predicted capabilities with no distinct GT capability =====================
unmatched_predictions:
  - predicted: PF-CAP-ORDER-VIEW
    classification: unmatched_prediction
    severity: low
    explanation: >
      Order lookup/history as a distinct SHARED capability has no corresponding ground-truth capability
      entry (GT folds order viewing into app-specific order management and does not list it as a shared
      capability or overlap scenario). Not wrong as an observation (all three apps read Orders), but it
      is an EXTRA consolidated capability not in the GT catalog. Counted as a false positive on the
      capability axis. Low severity: it reflects a real read pattern, it is not a fabricated business function.
  - predicted: SHARED-IDEMPOTENCY
    classification: not_a_capability
    severity: none
    explanation: >
      Listed in capability-overlaps.yaml as a relationship between rules, not a business capability.
      Excluded from the capability denominator; evaluated under business rules (RULE-IDEMPOTENCY) instead.

notes:
  - All 27 ground-truth capabilities were matched (20 exact + ... see scorecard). No ground-truth capability is fully undiscovered (no unmatched_ground_truth).
  - Stage 1 discovered every app-specific capability at finer granularity; Stage 2 merges are correct except for the two under-surfaced items (CAP-CP-AUTH, and the override granularity of CAP-OD-CANCEL-OVERRIDE).
