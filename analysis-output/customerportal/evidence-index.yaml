tests_executed:
  - command: dotnet test tests/CustomerPortal.Tests/CustomerPortal.Tests.csproj
    result: Passed 16/16
    verifies: [CP-RULE-008, CP-RULE-015, CP-RULE-017, CP-RULE-021]
  - command: dotnet test tests/IntegrationTests (filter CustomerPortalWorkflowTests)
    result: Passed 6/6
    verifies: [CP-CAP-006, CP-CAP-007, CP-CAP-009, CP-CAP-011, CP-CAP-012,
               CP-RULE-008, CP-RULE-009, CP-RULE-011, CP-RULE-012, CP-RULE-014, CP-RULE-015, CP-RULE-017]
    environment: LegacyRetailDB on (localdb)\\MSSQLLocalDB (pre-provisioned; disposable rows created by TestData)

id_cross_reference:
  capabilities_file: analysis-output/customerportal/capabilities.yaml
  entities_file: analysis-output/customerportal/entities.yaml
  rules_file: analysis-output/customerportal/business-rules.yaml
  workflows_file: analysis-output/customerportal/workflows.yaml
  dependencies_file: analysis-output/customerportal/dependencies.yaml

key_evidence_map:
  CP-CAP-009:   # idempotent checkout
    - src/CustomerPortal/CustomerPortal.Application/CheckoutService.cs:CheckoutAsync
    - database/schema/01_schema.sql:UQ_Orders_Idempotency
    - tests/IntegrationTests/CustomerPortalWorkflowTests.cs:Checkout_creates_order_and_is_idempotent
  CP-CAP-011:   # customer cancellation (stricter)
    - src/CustomerPortal/CustomerPortal.Domain/PortalRules.cs:CustomerCanCancel
    - src/CustomerPortal/CustomerPortal.Application/OrderHistoryService.cs:RequestCancellationAsync
    - tests/IntegrationTests/CustomerPortalWorkflowTests.cs:Customer_cancellation_is_stricter_blocks_allocated
  CP-RULE-014:  # ownership
    - tests/IntegrationTests/CustomerPortalWorkflowTests.cs:Ownership_enforced_cannot_cancel_another_customers_order

note_on_test_cross_reference: >
  tests/CustomerPortal.Tests/PortalRulesTests.cs contains an assertion that references
  OrderDesk.Domain.OrderDeskRules to characterize a cancellation-eligibility difference.
  That reference lives in the test project, not in CustomerPortal application code, and was
  not used to infer any behavior of another application.

unresolved_or_uninspected:
  - Razor views were enumerated and their tag-helper bindings sampled (Login, Cart, Checkout,
    Orders) to confirm antiforgery + controller/VM wiring; not every .cshtml was read line-by-line.
  - dbo.Shipments / dbo.CarrierEvents DDL not inspected (defined outside the portal/shared schema files; external).
