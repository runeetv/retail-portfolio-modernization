multi_model_tables_note: >
  Entities.cs comments note CustomerAccount and ShopperProfile are the portal's own
  models and that dbo.Customers is also represented by a differently-named model in
  another application. CustomerOrder/CustomerReturn similarly map to shared Orders/Returns
  tables. This analysis documents only the portal's representation.
