    physical_table: dbo.CustomerPreferences
    role: supporting_entity
    key_attributes: [CustomerPreferenceId (PK), CustomerAccountId (FK), PrefKey, PrefValue]
    relationships: [belongs to CustomerAccount]
    lifecycle: Read only in portal code (GetPreferencesAsync). No write path observed.
    crud: [read]
    ownership: customer-owned
    evidence: ProfileService.GetPreferencesAsync; database/schema/03_customerportal.sql:CustomerPreferences
    confidence: medium
    verification: static_verified

