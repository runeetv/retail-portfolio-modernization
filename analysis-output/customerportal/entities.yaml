# CustomerPortal — Domain Entity Reconstruction
# role: aggregate_root | supporting_entity | value_object | technical_structure | read_model
# Source namespace: CustomerPortal.Domain (Entities.cs). Mappings from PortalDbContext.
version: 1
application: CustomerPortal

entities:
  - id: CP-ENT-001
    name: CustomerAccount
    purpose: Portal login identity. The central account aggregate; links to the shared customer profile row.
    source_class: CustomerPortal.Domain.CustomerAccount
    source_file: src/CustomerPortal/CustomerPortal.Domain/Entities.cs
    physical_table: dbo.CustomerAccounts
    role: aggregate_root
    key_attributes: [CustomerAccountId (PK), CustomerId (FK->Customers, unique), Username (unique), PasswordHash, IsLocked, LastLoginUtc, CreatedUtc]
    relationships: [Profile (ShopperProfile) via CustomerId; owns carts/wishlists/tickets/preferences/redemptions by CustomerAccountId]
    lifecycle: Read on login; LastLoginUtc updated on sign-in. No create/delete path observed in portal code.
    crud: [read, update]
    ownership: customer-owned identity
    evidence: AuthService.SignInAsync; PortalDbContext(CustomerAccount); database/schema/03_customerportal.sql:CustomerAccounts
    confidence: high
    verification: static_verified

  - id: CP-ENT-002
    name: ShopperProfile
    purpose: >
      Portal's narrow self-service view of the shared customer record. A SECOND C#
      model mapped to dbo.Customers (the comment in Entities.cs states another app
      calls this "Customer").
    source_class: CustomerPortal.Domain.ShopperProfile
    source_file: src/CustomerPortal/CustomerPortal.Domain/Entities.cs
    physical_table: dbo.Customers
    role: supporting_entity
    key_attributes: [CustomerId (PK), FirstName, LastName, Email, Phone, Ship* address, CustomerStatus]
    relationships: [1:1 with CustomerAccount via CustomerId]
    lifecycle: Read for display; only contact + shipping fields updated via self-service. Name/email/status not editable in portal.
    crud: [read, update(subset)]
    ownership: customer-owned profile (shared physical table)
    evidence: ProfileService; PortalDbContext(ShopperProfile -> "Customers")
    confidence: high
    verification: static_verified
    note: CP-ENT-002 (ShopperProfile) and CP-ENT-003 refer to the same physical dbo.Customers row via CustomerId.

