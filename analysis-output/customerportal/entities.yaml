  - id: CP-ENT-009
    name: CustomerOrder
    purpose: Portal's view of an order placed by the shopper (carries an idempotency key).
    source_class: CustomerPortal.Domain.CustomerOrder
    source_file: src/CustomerPortal/CustomerPortal.Domain/Entities.cs
    physical_table: dbo.Orders
    role: aggregate_root
    key_attributes: [OrderId (PK), OrderNumber, CustomerId, OrderStatus, OrderSource, SubTotal, DiscountTotal, GrandTotal, IdempotencyKey, CancelReason, PlacedUtc]
    aggregates: [CustomerOrderLine]
    states_observed_in_portal: [Confirmed (on create), Cancelled (on customer cancel)]
    relationships: [Lines]
    lifecycle: >
      Created by checkout (OrderStatus=Confirmed, OrderSource=CustomerPortal). Customer
      may set Cancelled. Later lifecycle states (Allocated/Delivered/etc.) and orders with
      other OrderSource values are produced/advanced externally.
    crud: [create, read, update]
    ownership: customer-owned at the portal boundary (shared physical table)
    evidence: CheckoutService; OrderHistoryService; PortalDbContext(CustomerOrder -> "Orders")
    confidence: high
    verification: behavior_verified
    external_dependencies: [EXT-ORDERS-OTHER-SOURCE]

