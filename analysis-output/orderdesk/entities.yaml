    role: supporting_entity
    key_attributes: [ProductId (PK), Sku, Name, CategoryId (FK), UnitPrice, IsDiscontinued]
    relationships: [Product.Category -> ProductCategory]
    lifecycle: Read-only within OrderDesk.
    crud: [read]
    evidence: src/OrderDesk/OrderDesk.Domain/Entities.cs:Product; OrderDeskDbContext.OnModelCreating(Product)
    confidence: high
    verification: static_verified

