    crud: [create, read]
    evidence: src/OrderDesk/OrderDesk.Domain/Entities.cs:OrderLine; OrderService.CreateStaffOrderAsync; usp_ConvertQuoteToOrder
    confidence: high
    verification: behavior_verified

