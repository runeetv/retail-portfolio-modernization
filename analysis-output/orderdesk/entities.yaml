  - id: OD-ENT-011
    name: Order
    purpose: Staff-facing view of a sales order.
    source_class: OrderDesk.Domain.Order
    source_file: src/OrderDesk/OrderDesk.Domain/Entities.cs
    physical_table: dbo.Orders
    role: aggregate_root
    key_attributes: [OrderId (PK), OrderNumber (unique), CustomerId, OrderStatus, OrderSource, SubTotal, DiscountTotal, GrandTotal, PlacedByAgentId, SourceQuoteId, CancelReason, PlacedUtc]
    aggregates: [OrderLine]
    states: [Pending, Confirmed, Allocated, Picking, Packed, Shipped, Delivered, Cancelled]  # CK_Orders_Status (not all transitions driven by OrderDesk)
    relationships: [Customer, Lines(OrderLine), SourceQuoteId -> SalesQuote]
    lifecycle: >
      Created by OrderDesk (staff order, OrderSource='OrderDesk') or by usp_ConvertQuoteToOrder.
      OrderDesk updates OrderStatus to 'Cancelled'. Shared table — rows with OrderSource='CustomerPortal'
      and later lifecycle statuses are produced/advanced by external sources.
    crud: [create, read, update]
    evidence: src/OrderDesk/OrderDesk.Domain/Entities.cs:Order; OrderService; usp_ConvertQuoteToOrder; database/schema/01_schema.sql:Orders
    confidence: high
    verification: behavior_verified

