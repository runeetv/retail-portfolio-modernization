  - id: OD-ENT-005
    name: SalesAgent
    purpose: Internal sales representative; carries commission rate and cancellation-override authority.
    source_class: OrderDesk.Domain.SalesAgent
    source_file: src/OrderDesk/OrderDesk.Domain/Entities.cs
    physical_table: dbo.SalesAgents
    role: aggregate_root
    key_attributes: [SalesAgentId (PK), AgentCode (unique), FullName, Email, CommissionRate, CanOverrideCancellation, IsActive]
    relationships: [referenced by SalesQuote, SalesCommission, SalesAgentTask, CancellationOverride, DiscountApproval.ApprovedByAgentId]
    lifecycle: Read-only within OrderDesk (no create/update path observed).
    crud: [read]
    evidence: src/OrderDesk/OrderDesk.Domain/Entities.cs:SalesAgent; database/schema/02_orderdesk.sql:SalesAgents
    confidence: high
    verification: static_verified

  - id: OD-ENT-006
    name: SalesQuote
    purpose: A priced sales quotation that can be converted into an order.
    source_class: OrderDesk.Domain.SalesQuote
    source_file: src/OrderDesk/OrderDesk.Domain/Entities.cs
    physical_table: dbo.SalesQuotes
    role: aggregate_root
    key_attributes: [SalesQuoteId (PK), QuoteNumber (unique), CustomerId, SalesAgentId, QuoteStatus, DiscountPercent, SubTotal, GrandTotal, CreatedUtc, ExpiresUtc, ConvertedOrderId]
    aggregates: [SalesQuoteLine]
    states: [Draft, PendingApproval, Approved, Rejected, Expired, Converted]  # QuoteStatus enum / CK_SalesQuotes_Status
    derived_members: [IsExpired(utcNow)]
    relationships: [Customer, SalesAgent, Lines(SalesQuoteLine), ConvertedOrderId -> Order]
    lifecycle: Created, updated, and transitioned by OrderDesk; marked Converted by usp_ConvertQuoteToOrder.
    crud: [create, read, update]
    evidence: src/OrderDesk/OrderDesk.Domain/Entities.cs:SalesQuote; QuoteService; database/schema/02_orderdesk.sql:SalesQuotes
    confidence: high
    verification: behavior_verified

