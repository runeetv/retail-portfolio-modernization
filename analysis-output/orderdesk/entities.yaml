# OrderDesk — Domain Entity Reconstruction
# role: aggregate_root | supporting_entity | value_object | technical_structure | read_model
# Source class namespace: OrderDesk.Domain (unless noted). Mappings from OrderDeskDbContext.
version: 1
application: OrderDesk

entities:
  - id: OD-ENT-001
    name: Customer
    purpose: Staff-facing view of a customer the business sells to.
    source_class: OrderDesk.Domain.Customer
    source_file: src/OrderDesk/OrderDesk.Domain/Entities.cs
    physical_table: dbo.Customers
    role: aggregate_root
    key_attributes: [CustomerId (PK), FirstName, LastName, Email, Phone, Ship* address, CustomerStatus]
    derived_members: [FullName, HasMandatoryOrderInfo]
    relationships:
      - referenced by SalesQuote.CustomerId, Order.CustomerId, SalesAgentTask.RelatedCustomerId
    lifecycle: OrderDesk reads and updates (CRU). No delete path observed. Rows may also be created/updated by external sources (shared table).
    crud: [read, update]
    evidence: src/OrderDesk/OrderDesk.Domain/Entities.cs:Customer; OrderDeskDbContext.OnModelCreating(Customer)
    confidence: high
    verification: static_verified

