notes:
  - The domain comments state OrderDesk defines its OWN entity shapes even for shared
    tables (Customers, Products, Orders), distinct from other applications' models.
  - QuoteStatus is a C# enum (Draft, PendingApproval, Approved, Rejected, Expired, Converted);
    the DB column is NVARCHAR with CK_SalesQuotes_Status enforcing the same set.
